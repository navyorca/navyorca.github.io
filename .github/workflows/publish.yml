name: publish-feed
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node publish.mjs
        env:
          BLUESKY_HANDLE: navyorca.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          FEED_RKEY: like-next-post
          SERVICE_DID: did:web:navyorca.github.io
